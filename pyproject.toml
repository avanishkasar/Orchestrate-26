[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "okit"
version = "0.1.0"
description = "Generic, domain-agnostic tooling for 24h agent hackathons: LLM client, cache, ledger, agent loop, eval, submission checks."
authors = [{ name = "Avanish Kasar" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7,<3",
  "pillow>=10.3",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["okit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Intentional Unicode in report text and the fence-breaking guard.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# Regex patterns read better unsplit.
"okit/safety/injection.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
